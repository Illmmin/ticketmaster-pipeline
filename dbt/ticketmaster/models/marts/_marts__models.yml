version: 2

models:
  - name: fct_events
    description: Table de faits, un événement par ligne, prête pour l'analyse de prix par genre/artiste/venue
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: venue_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_venues')
                field: venue_id
              config:
                severity: warn

  - name: dim_venues
    description: Dimension des salles
    columns:
      - name: venue_id
        data_tests:
          - unique
          - not_null

  - name: dim_artists
    description: Dimension des artistes
    columns:
      - name: artist_id
        data_tests:
          - unique
          - not_null

  - name: bridge_event_artists
    description: Table de liaison many-to-many entre événements et artistes
    columns:
      - name: event_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_events')
                field: event_id
      - name: artist_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_artists')
                field: artist_id